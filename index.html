<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <title>Nexus 08: A Casa Inteligente</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SISTEMA NEXUS 08</p>
          <h1>Casa Inteligente</h1>
        </div>
        <button id="restart-button" class="icon-button" type="button" aria-label="Reiniciar história">
          ↻
        </button>
      </header>

      <section class="status-panel" aria-label="Status da missão">
        <div class="status-item">
          <span>Etapa</span>
          <strong id="step-count">1</strong>
        </div>
        <div class="status-item">
          <span>Nível de confiança</span>
          <strong id="trust-count">50%</strong>
        </div>
        <div class="status-item">
          <span>Zona</span>
          <strong id="zone-name">Entrada</strong>
        </div>
      </section>

      <section id="game" class="game-card" aria-live="polite">
        <div id="story-kicker" class="story-kicker"></div>
        <h2 id="story-title"></h2>
        <p id="story-text"></p>
        <div id="choices" class="choices"></div>
      </section>

      <footer class="credits">
        <span>Equipe</span>
        <strong>Eduardo Frederic Heil Lehrer · Vinícius Pinheiro</strong>
        <span>Números 08 e 39</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
